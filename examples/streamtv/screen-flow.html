<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamTV — app navigation</title>
<style>
:root {
  --bg: #f3f4f6; --dot: #d3d7de; --panel: #ffffff; --panel-2: #f6f7f9; --border: #e2e5ea;
  --text: #15181e; --muted: #5f6775; --accent: #3563e9; --edge: #7f8797; --edge-back: #b4bac5;
  --label-bg: #ffffff; --card: #ffffff;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.09);
  --shadow-hi: 0 0 0 3px var(--accent), 0 14px 36px rgba(16,24,40,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1014; --dot: #252932; --panel: #161920; --panel-2: #1c2028; --border: #2a2f3a;
    --text: #e7e9ee; --muted: #98a0ae; --accent: #7c9dff; --edge: #727b8c; --edge-back: #474e5b;
    --label-bg: #1c2028; --card: #1a1d24;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.35);
    --shadow-hi: 0 0 0 3px var(--accent), 0 14px 36px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button { font: inherit; color: inherit; }
#app { display: flex; height: 100%; }

/* ---------- sidebar ---------- */
#side {
  width: 288px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; z-index: 20; transition: margin-left .2s ease;
}
#app.side-closed #side { margin-left: -288px; }
.side-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
.side-head h1 { font-size: 17px; line-height: 1.3; margin: 0 0 4px; letter-spacing: -.01em; }
.side-head p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.meta span { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
.search { padding: 12px 18px; border-bottom: 1px solid var(--border); }
.search input {
  width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font: inherit; outline: none;
}
.search input:focus { border-color: var(--accent); }
#tree { overflow: auto; flex: 1; padding: 8px 8px 24px; }
.g-item { margin-bottom: 4px; }
.g-btn, .s-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0;
  background: none; padding: 6px 10px; border-radius: 7px; cursor: pointer;
}
.g-btn { font-weight: 600; }
.g-btn:hover, .s-btn:hover { background: var(--panel-2); }
.s-btn { padding-left: 28px; color: var(--muted); font-size: 13px; }
.s-btn.active { background: var(--panel-2); color: var(--text); }
.s-btn.hidden-by-search { display: none; }
.g-btn .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* ---------- stage ---------- */
#stage {
  position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px);
}
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

.frame {
  position: absolute; border-radius: 22px;
  background: color-mix(in srgb, var(--g) 7%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--g) 35%, transparent);
}
.frame.kind-nav { border-width: 2px; background: color-mix(in srgb, var(--g) 10%, transparent); }
.frame-grip {
  position: absolute; left: 0; right: 0; top: 0; cursor: move; border-radius: 22px 22px 0 0; z-index: 1;
}
.frame-grip:hover { background: color-mix(in srgb, var(--g) 10%, transparent); }
.frame.dragging { box-shadow: 0 0 0 2px var(--g); }
.frame.dragging .frame-grip { cursor: grabbing; }
.frame-h { position: absolute; left: 24px; top: 18px; right: 24px; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; }
.frame-h b { font-size: 22px; letter-spacing: -.01em; color: color-mix(in srgb, var(--g) 70%, var(--text)); }
.frame-h span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }

#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.e { fill: none; stroke: var(--edge); stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); transition: opacity .15s; }
.e.cross { stroke-dasharray: 9 6; }
.e.kind-back { stroke: var(--edge-back); stroke-dasharray: 3 6; }
.e.kind-modal { stroke-dasharray: 2 5; stroke-linecap: round; }
.e.hl { stroke: var(--accent) !important; stroke-width: 3; }
body.hide-back .e.kind-back, body.hide-back .lbl.kind-back { display: none; }
body.hide-cross .e.cross, body.hide-cross .lbl.cross { display: none; }
body.hide-labels .lbl { display: none; }

#labels { position: absolute; left: 0; top: 0; pointer-events: none; }
.lbl {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; max-width: 220px;
  overflow: hidden; text-overflow: ellipsis; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--label-bg); border: 1px solid var(--border); color: var(--muted); transition: opacity .15s;
}
.lbl.hl { color: var(--text); border-color: var(--accent); z-index: 2; }

#cards { position: absolute; left: 0; top: 0; }
.card {
  position: absolute; background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
  border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: opacity .15s, box-shadow .15s;
  user-select: none; -webkit-user-select: none;
}
.card:hover, .card.hl { box-shadow: var(--shadow-hi); }
.card.selected { box-shadow: var(--shadow-hi); outline: 2px solid var(--accent); outline-offset: 3px; }
.card.dragging { cursor: grabbing; transition: none; z-index: 5; }
.card-h { height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.card-h .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-h .r { margin-left: auto; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.card-img { position: relative; overflow: hidden; background: var(--panel-2); }
.card-img img { display: block; width: 100%; height: auto; pointer-events: none; }
.hs {
  position: absolute; display: none; border: 2px solid var(--c); border-radius: 6px; pointer-events: none;
  background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 25%, transparent);
}
body.hotspots .hs.on { display: block; }
.hs.hl { border-width: 3px; background: color-mix(in srgb, var(--c) 30%, transparent); }
.card-img.cropped::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
  background: linear-gradient(transparent, color-mix(in srgb, var(--card) 92%, transparent));
}
.noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
.badges { position: absolute; top: 52px; left: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.badge.state { background: #6b7280; }

body.focusing .card:not(.hl):not(.selected) { opacity: .4; }
body.focusing .e:not(.hl), body.focusing .lbl:not(.hl) { opacity: .1; }
body.searching .card:not(.match) { opacity: .2; }

/* ---------- toolbar / minimap ---------- */
.toolbar {
  position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 2px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; z-index: 10;
  max-width: calc(100% - 248px); overflow-x: auto;
}
.tb { border: 0; background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.tb:hover { background: var(--panel-2); }
.tb[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.tb.zoom { min-width: 56px; font-variant-numeric: tabular-nums; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: none; }
#side-toggle { position: absolute; left: 12px; top: 12px; z-index: 10; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); }
.pop {
  position: absolute; left: 16px; bottom: 70px; z-index: 12; width: 280px; padding: 14px; display: grid; gap: 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); cursor: default;
}
.pop[hidden] { display: none; }
.pop-h { font-weight: 700; }
.pop label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.pop label.chk { justify-content: flex-start; }
.pop label[hidden] { display: none; }
.pop select { flex: 1; max-width: 170px; padding: 5px 6px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
.pop-b { display: flex; gap: 8px; }
.pop-b button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 13px; }
.pop-b button:hover { border-color: var(--accent); }
.pop-b button:disabled { opacity: .5; cursor: progress; }
.pop-s { font-size: 12px; color: var(--muted); }
#minimap {
  position: absolute; right: 16px; bottom: 16px; width: 200px; height: 136px; z-index: 10;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); cursor: pointer;
}
.hint { position: absolute; right: 16px; top: 14px; color: var(--muted); font-size: 12px; z-index: 5; pointer-events: none; transition: opacity .6s; }
.hint.gone { opacity: 0; }

/* ---------- detail drawer ---------- */
#detail {
  width: 440px; flex: none; background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; z-index: 20;
}
#detail[hidden] { display: none; }
.d-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.d-head h2 { margin: 2px 0 2px; font-size: 18px; line-height: 1.3; }
.d-head .close { margin-left: auto; border: 0; background: var(--panel-2); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; flex: none; font-size: 16px; }
.d-body { overflow: auto; flex: 1; padding: 14px 18px 28px; }
.d-route { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
.d-notes { margin: 10px 0 14px; white-space: pre-wrap; }
.d-img { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel-2); margin-bottom: 18px; }
.d-img { position: relative; }
.d-img img { display: block; width: 100%; height: auto; }
.d-hs {
  position: absolute; border: 2px solid var(--c); border-radius: 6px; cursor: pointer; padding: 0;
  background: color-mix(in srgb, var(--c) 14%, transparent); transition: background .15s;
}
.d-hs:hover { background: color-mix(in srgb, var(--c) 32%, transparent); }
.d-hs span {
  position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); white-space: nowrap;
  font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--c); color: #fff; pointer-events: none;
  opacity: 0; transition: opacity .15s;
}
.d-hs:hover span { opacity: 1; }
.d-tip { color: var(--muted); font-size: 12px; margin: -10px 0 14px; }
.d-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin: 16px 0 6px; }
.link {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 4px;
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 9px; cursor: pointer;
}
.link:hover { border-color: var(--accent); }
.link .lt { font-weight: 600; }
.link .la { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
.empty { color: var(--muted); font-size: 13px; }

@media (max-width: 760px) {
  #side { position: absolute; top: 0; bottom: 0; left: 0; box-shadow: var(--shadow); }
  #detail { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; }
  #minimap, .hint { display: none; }
  .toolbar { left: 12px; max-width: calc(100% - 24px); }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <h1 id="title"></h1>
      <p id="desc"></p>
      <div class="meta" id="meta"></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search screens…  ( / )" autocomplete="off"></div>
    <nav id="tree"></nav>
  </aside>
  <main id="stage">
    <div id="world">
      <div id="frames"></div>
      <div id="cards"></div>
      <svg id="edges" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path>
          </marker>
        </defs>
        <g id="paths"></g>
      </svg>
      <div id="labels"></div>
    </div>
    <button class="tb" id="side-toggle" title="Toggle sidebar">☰</button>
    <div class="hint">Drag to pan · scroll / pinch to zoom · drag screens or group headings to rearrange</div>
    <div class="toolbar">
      <button class="tb" id="zoom-out" title="Zoom out (-)">−</button>
      <button class="tb zoom" id="zoom-val" title="Reset to 100%">100%</button>
      <button class="tb" id="zoom-in" title="Zoom in (+)">+</button>
      <button class="tb" id="fit" title="Fit all (F)">Fit</button>
      <span class="sep"></span>
      <button class="tb" id="t-labels" aria-pressed="true" title="Show arrow labels">Labels</button>
      <button class="tb" id="t-cross" aria-pressed="true" title="Show links between groups">Cross-group</button>
      <button class="tb" id="t-back" aria-pressed="true" title="Show back links">Back links</button>
      <button class="tb" id="t-hotspots" aria-pressed="true" title="Start arrows at the button or area that is tapped (H)" hidden>Hotspots</button>
      <span class="sep" id="reset-sep" hidden></span>
      <button class="tb" id="reset" hidden title="Undo your manual moves">Reset layout</button>
      <span class="sep"></span>
      <button class="tb" id="export" title="Download as PNG or PDF">Export</button>
    </div>
    <canvas id="minimap" width="400" height="272"></canvas>
    <div class="pop" id="export-pop" hidden>
      <div class="pop-h">Export</div>
      <label>Area <select id="x-scope"></select></label>
      <label>Theme <select id="x-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label class="chk" id="x-pages-row"><input type="checkbox" id="x-pages" checked> PDF: one extra page per group</label>
      <div class="pop-b"><button id="x-png">Download PNG</button><button id="x-pdf">Download PDF</button></div>
      <div class="pop-s" id="x-status">Uses the current toggles (labels, links, hotspots).</div>
    </div>
  </main>
  <section id="detail" hidden>
    <div class="d-head">
      <div style="min-width:0">
        <div class="kind" id="d-group"></div>
        <h2 id="d-title"></h2>
        <div class="d-route" id="d-route"></div>
      </div>
      <button class="close" id="d-close" title="Close (Esc)">✕</button>
    </div>
    <div class="d-body" id="d-body"></div>
  </section>
</div>

  edges.forEach(e => { for (let k = 0; k < e.pts.length - 1; k++) lines.push({ e, a: e.pts[k], b: e.pts[k + 1] }); });

  const order = edges.filter(e => e.label && e.lw).sort((p, q) => p.pts.length - q.pts.length || p.i - q.i);

      const inner = k > 0 && k < p.length - 2;
      const horiz = Math.abs(a[1] - b[1]) < 0.5;
      const fits = horiz ? len > w + 24 : len > h + 24;
      const base = (fits ? 0 : 60) + (inner ? 0 : 25) - Math.min(len, 400) / 40;

      let score = c.pen;
      for (const q of cards) if (hit(r, q)) score += 2000 + area(r, q);
      for (const q of placed) if (hit(r, q)) score += 1500 + area(r, q);
      for (const ln of lines) {
        if (ln.e === e) continue;

}

/* Start the route at the hotspot: run over the screenshot to the card edge, then follow the route. */

  } else {

  }

  // shift into its own lane (nudge) if it would share a line with another arrow.
  const route = e.pts, A = [p0[0] + d[0] * 10, p0[1] + d[1] * 10];

}
function routeEdges(fast = false) {

        const s = stubOf(p, side);

    e.pts = simplify((G && routeOnGrid(G, e)) || simpleRoute(e));

  if (!fast) { nudgeObs = obstacles().map(o => ({ l: o.l - 2, t: o.t - 2, r: o.r + 2, b: o.b + 2 })); nudge(); }
  for (const e of edges) e.pts = simplify(e.pts);
  edges.forEach((e, i) => { edgeEls[i].setAttribute('d', roundedPath(e.pts)); if (e.hsEl) e.hsEl.classList.toggle('on', !!e.hsr); });

}

const stage = $('stage'), world = $('world');

function drawCards(ctx, T, only) {

function exportBox(scope) {

async function renderCanvas({ scope = 'all', theme = currentTheme(), scale = 2, maxPixels = 32e6 } = {}) {
  await Promise.all([...document.querySelectorAll('.card img')].map(i => i.decode().catch(() => {})));
  const T = THEMES[theme] || THEMES.light, box = exportBox(scope);
  const g = groupById.get(scope);
  const title = scope !== 'view';
  const head = title ? 96 : 0, W = box.r - box.l, H = box.b - box.t + head;
  if (scope === 'view') scale = Math.max(1, Math.min(3, cam.k * (window.devicePixelRatio || 1)));
  const k = Math.min(scale, Math.sqrt(maxPixels / (W * H)), 16000 / W, 16000 / H);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(W * k)); cv.height = Math.max(1, Math.round(H * k));

    ctx.font = `700 30px ${FONT}`; ctx.fillStyle = T.text;
    ctx.fillText(fitText(ctx, (D.title || 'Screen flow') + (g ? ' — ' + (g.label || g.id) : ''), W - 80), 40, 54);
    const meta = [g ? g.description : D.description, (g ? g.screens.length : screens.length) + ' screens',

const toBlob = (cv, type, q) => new Promise(res => cv.toBlob(res, type, q));

/* Minimal PDF: one JPEG image per page, page long side 1190pt (A3), plus the title as metadata. */
function makePdf(pages, title) {
  const enc = new TextEncoder(), chunks = [], offs = [];

  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const obj = (n, ...parts) => { offs[n] = len; push(`${n} 0 obj\n`); parts.forEach(push); push('\nendobj\n'); };

  obj(3, `<< /Title <${hex(title)}> /Producer (screen-flow) >>`);
  pages.forEach((p, i) => {
    const long = 1190, ratio = p.w / p.h;
    const pw = (ratio >= 1 ? long : long * ratio).toFixed(2), ph = (ratio >= 1 ? long / ratio : long).toFixed(2);
    const n = 4 + 3 * i, content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`);
    obj(n + 1, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    obj(n + 2, `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`, p.jpeg, '\nendstream');

  const scopes = [scope];
  if (scope === 'all' && pagePerGroup && live.length > 1) scopes.push(...live.map(g => g.id));
  const pages = [];
  for (const sc of scopes) {
